name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
  workflow_dispatch:

concurrency:
  group: firebase-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment connection
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROVIDER" || { echo "::error::Set GCP_WORKLOAD_IDENTITY_PROVIDER repository variable"; exit 1; }
          test -n "$SERVICE_ACCOUNT" || { echo "::error::Set GCP_DEPLOY_SERVICE_ACCOUNT repository variable"; exit 1; }

      - uses: google-github-actions/auth@v3
        with:
          project_id: morivo-mvp
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Check functions syntax
        run: node --check functions/index.js

      - name: Deploy experience generator
        run: npx --yes firebase-tools@14 deploy --only functions:generateExperience --project morivo-mvp --non-interactive
