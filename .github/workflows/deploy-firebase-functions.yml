name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - "firestore.rules"
      - "storage.rules"
      - ".github/workflows/deploy-firebase-functions.yml"
  workflow_dispatch:

concurrency:
  group: firebase-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v3
        with:
          project_id: morivo-mvp
          workload_identity_provider: projects/1018467228668/locations/global/workloadIdentityPools/morivo-github/providers/morivo-main
          service_account: morivo-functions-deploy@morivo-mvp.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Check functions syntax
        run: node --check functions/index.js

      - name: Verify master authorization
        run: |
          node tests/participantIdentity.test.cjs
          node tests/masterAccess.test.cjs
          node tests/reorderExperience.test.cjs
          node tests/experienceArtwork.test.cjs

      # Every function added here used to also need adding, by name, to an explicit --only list
      # below - and proposeItinerary never was. It silently never deployed through this workflow
      # since the day it was written: every fix pushed to it this session (timeout increases,
      # the day/destination-order chunking rework, the diagnostic error message) sat in git while
      # production kept running whatever was last deployed manually, which is exactly why
      # organizers kept hitting the same failure on the planning step after fixes that should
      # have resolved it. Deploying the whole functions codebase removes this entire class of
      # "forgot to add the new function to the list" bug instead of just patching this one gap.
      - name: Deploy experience generator
        run: npx --yes firebase-tools@14 deploy --only functions --project morivo-mvp --non-interactive --force

      - name: Deploy access rules
        run: npx --yes firebase-tools@14 deploy --only firestore:rules,storage --project morivo-mvp --non-interactive
