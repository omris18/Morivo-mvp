name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-firebase-functions.yml"
  workflow_dispatch:

concurrency:
  group: firebase-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v3
        with:
          project_id: morivo-mvp
          workload_identity_provider: projects/1018467228668/locations/global/workloadIdentityPools/morivo-github/providers/morivo-main
          service_account: morivo-functions-deploy@morivo-mvp.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Check functions syntax
        run: node --check functions/index.js

      - name: Deploy experience generator
        run: npx --yes firebase-tools@14 deploy --only functions:generateExperience --project morivo-mvp --non-interactive
